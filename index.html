<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Aceptas una salida conmigo?</title>
<style>
  *{box-sizing:border-box;}
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100vh;
    margin:0;
    background:#fff5f7;
    font-family: 'Segoe UI', sans-serif;
    text-align:center;
    overflow:hidden;
  }
  .frame{
    width: 100%;
    max-width: 380px;
    aspect-ratio: 9 / 14;
    max-height: 55vh;
    overflow:hidden;
    background:#000;
  }
  .frame img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
    transition: transform .2s ease;
  }
  h1{
    font-size: clamp(18px, 5vw, 26px);
    margin: 18px 10px 24px 10px;
  }
  .buttons{
    position: relative;
    width: 320px;
    height: 100px;
  }
  button{
    border:none;
    border-radius: 10px;
    color:#fff;
    font-size: 17px;
    font-weight:600;
    padding: 14px 26px;
    cursor:pointer;
    position:absolute;
    top:50%;
    transform: translateY(-50%);
    transition: left .15s ease, top .15s ease, font-size .2s ease;
  }
  #si{
    left:30px;
    background:#2ecc71;
  }
  #no{
    left:170px;
    background:#e74c3c;
    white-space: nowrap;
  }
  #final{
    display:none;
    font-size: clamp(18px, 5vw, 24px);
    font-weight:700;
    color:#e74c3c;
    margin-top:18px;
    padding: 0 16px;
  }
</style>
</head>
<body>

  <div class="frame">
    <img src="imagenes/imagengatoramo.jpg" id="catImg" alt="gato">
  </div>

  <h1 id="question">¿Aceptas una salida conmigo? </h1>

  <div class="buttons" id="buttonsBox">
    <button id="si">Sí</button>
    <button id="no">No</button>
  </div>

  <div id="final">Sabía que aceptarías, la vamos a pasar bien 😊</div>

<script>
  const noBtn = document.getElementById('no');
  const siBtn = document.getElementById('si');
  const box = document.getElementById('buttonsBox');
  const question = document.getElementById('question');
  const final = document.getElementById('final');
  const catImg = document.getElementById('catImg');

  // Frases en el orden exacto del video (se repite la última si se acaban)
  const frases = [
    "No",
    "¿Seguro que no quieres salir conmigo?",
    "¿Ni una salidita?",
    "¿Ni a ir por un café?",
    "¿Ni a compartir un helado?",
    "¿Ni a tener un divertido dia?",
    "¿Ni a un billar?",
    "¿De verdad no quieres salir conmigo?"
  ];

  // Imágenes en orden: ramo -> rosa -> ojo -> brinco -> teléfono (se queda fija aquí)
  const secuenciaImagenes = [
    "imagenes/imagengatoramo.jpg",
    "imagenes/gatorosa.jpg",
    "imagenes/gatoOjo.jpg",
    "imagenes/gatobrinco.webp",
    "imagenes/gatotelefono.jpg"
  ];

  let contador = 0;
  let siScale = 1;

  function moveNoButton(){
    const maxX = box.clientWidth - noBtn.offsetWidth;
    const maxY = box.clientHeight - noBtn.offsetHeight;
    const x = Math.random() * Math.max(maxX, 10);
    const y = Math.random() * Math.max(maxY, 10);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.transform = 'translateY(0)';
  }

  function growSi(){
    siScale = Math.min(siScale + 0.15, 3);
    siBtn.style.fontSize = (17 * siScale) + 'px';
  }

  function cambiarImagen(){
    // Avanza en la secuencia, pero no pasa del último índice (se queda en teléfono)
    const idx = Math.min(contador, secuenciaImagenes.length - 1);
    catImg.style.transform = 'scale(1.06)';
    catImg.src = secuenciaImagenes[idx];
    setTimeout(() => { catImg.style.transform = 'scale(1)'; }, 200);
  }

  function escapeNo(){
    contador++;
    // Si ya no hay más frases nuevas, repite la última en bucle
    const idxFrase = Math.min(contador, frases.length - 1);
    noBtn.textContent = frases[idxFrase];
    cambiarImagen();
    moveNoButton();
    growSi();
  }

  noBtn.addEventListener('mouseenter', escapeNo);
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    escapeNo();
  }, {passive:false});
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    escapeNo();
  });

  siBtn.addEventListener('click', function(){
    catImg.src = "imagenes/gatobrinco.webp";
    box.style.display = 'none';
    question.style.display = 'none';
    final.style.display = 'block';
  });
</script>
</body>
</html>
